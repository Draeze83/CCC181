services:
  db:
    image: postgres:17
    container_name: qonnect-db
    environment:
      POSTGRES_USER: qonnect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: qonnect
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qonnect -d qonnect"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: